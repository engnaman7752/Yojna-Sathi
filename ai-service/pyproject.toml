[project]
name = "yojana-saathi-ai-service"
version = "0.1.0"
description = "Yojana Saathi AI service: chat agent, PDF extraction, RAG retrieval"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[gemini]>=1.56.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pypdf>=5.1",
    "chromadb>=1.5",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4.2", "jsonschema>=4.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
